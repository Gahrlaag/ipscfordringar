<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fordringar — skjutskicklighet</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A1019">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fordringar">
<style>
  :root{
    --bg:#0A1019;
    --surface:#15253F;
    --surface-2:#2C3D5B;
    --border:rgba(255,255,255,0.12);
    --text:#CFCFD0;
    --text-muted:#B3B3B3;
    --accent:#FEC000;
    --accent-soft:rgba(254,192,0,0.16);
    --accent-ink:#0A1019;
    --good:#3ED17E;
    --danger:#E5484D;
  }
  *{ box-sizing:border-box; }
  html, body{ margin:0; padding:0; background:var(--bg); }

  #pcc-root, #pcc-root *{ box-sizing:border-box; }
  #pcc-root{
    font-family:Calibri, 'Segoe UI', -apple-system, system-ui, sans-serif;
    background:var(--bg);
    color:var(--text);
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding:16px 14px 90px;
    -webkit-tap-highlight-color:transparent;
  }
  .mono{ font-variant-numeric:tabular-nums; }
  .good{ color:var(--good) !important; }

  .pcc-header{ margin-bottom:14px; }
  .pcc-title{ font-size:19px; font-weight:700; letter-spacing:-0.01em; margin:0 0 2px; }
  .pcc-subtitle{ font-size:11px; color:var(--text-muted); margin:0; }

  .pcc-shooters{ margin-bottom:14px; }
  .pcc-shooter-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .pcc-shooter-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:7px 6px 7px 12px; font-family:inherit; font-size:13px; font-weight:600;
    color:var(--text-muted); cursor:pointer;
  }
  .pcc-shooter-chip.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .pcc-shooter-chip .del{ background:none; border:none; color:inherit; opacity:.6; font-size:13px; padding:2px 4px; cursor:pointer; }
  .pcc-shooter-chip .del.confirm{ color:var(--danger); opacity:1; font-weight:700; }
  .pcc-add-shooter{ display:flex; gap:6px; }
  .pcc-add-shooter input{
    flex:1; background:var(--surface); border:1px solid var(--border); border-radius:9px;
    padding:9px 12px; color:var(--text); font-family:inherit; font-size:14px;
  }
  .pcc-add-shooter input:focus{ outline:none; border-color:var(--accent); }
  .pcc-add-shooter button{
    background:var(--accent); border:none; color:var(--accent-ink); font-family:inherit;
    font-weight:700; font-size:14px; padding:0 16px; border-radius:9px; cursor:pointer;
  }

  .pcc-tabs{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .pcc-tab{
    flex:1; min-width:64px; padding:9px 4px; text-align:center;
    background:var(--surface); border:1px solid var(--border);
    border-radius:9px; color:var(--text-muted);
    font-family:inherit; font-size:14px; font-weight:600;
    cursor:pointer;
  }
  .pcc-tab.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .pcc-tabs-discipline .pcc-tab{ font-size:13px; }

  .pcc-desc{
    background:var(--surface); border:1px solid var(--border);
    border-radius:9px; padding:9px 12px; margin-bottom:10px;
    font-size:12px; line-height:1.45; color:var(--text-muted);
  }
  .pcc-desc p{ margin:0 0 5px; }
  .pcc-desc p:last-of-type{ margin-bottom:0; }
  .pcc-desc-toggle{
    background:none; border:none; color:var(--accent); font-family:inherit;
    font-size:12px; font-weight:600; padding:5px 0 0; cursor:pointer;
  }

  .pcc-status{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--surface); border:1px solid var(--border); border-radius:9px;
    padding:9px 10px; margin-bottom:12px; font-size:13px; font-weight:600; color:var(--text-muted);
    text-align:center;
  }
  .pcc-status-pass{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

  .pcc-empty-shooters{
    background:var(--surface); border:1px dashed var(--border); border-radius:10px;
    padding:18px 14px; text-align:center; font-size:13px; color:var(--text-muted); margin-bottom:14px;
  }

  .pcc-serieslist{
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; overflow:hidden; margin-bottom:8px;
  }
  .pcc-list-header{
    display:flex; align-items:center; gap:8px; padding:6px 10px;
    font-size:10px; color:var(--text-muted); border-bottom:1px solid var(--border);
  }
  .pcc-series-row{
    display:flex; align-items:center; gap:8px; padding:8px 10px;
    border-bottom:1px solid var(--border);
  }
  .pcc-series-row:last-of-type{ border-bottom:none; }
  .pcc-series-row.pcc-row-gold{ background:var(--accent-soft); }
  .pcc-series-idx{ width:14px; text-align:center; font-size:11px; color:var(--text-muted); font-weight:700; flex-shrink:0; }
  .pcc-time-field{
    width:64px; flex-shrink:0; background:var(--surface-2); border:1px solid var(--border);
    border-radius:7px; padding:7px 6px; color:var(--text); font-size:13px; text-align:center;
  }
  .pcc-time-field:focus{ outline:none; border-color:var(--accent); }
  .pcc-hitgroup{ display:flex; gap:4px; flex:1; justify-content:center; }
  .pcc-chip{
    width:44px; flex-shrink:0; padding:7px 2px; text-align:center;
    background:var(--surface-2); border:1px solid var(--border); border-radius:7px;
    color:var(--text-muted); font-family:inherit; font-size:13px; font-weight:700;
    cursor:pointer;
  }
  .pcc-chip.filled-aa{ color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  .pcc-chip.filled-other{ color:var(--text); border-color:var(--border); background:var(--surface-2); }
  .pcc-chip.active{ outline:2px solid var(--accent); outline-offset:-1px; }
  .pcc-series-marg{ width:46px; flex-shrink:0; text-align:center; font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .pcc-series-hf{ width:62px; flex-shrink:0; text-align:right; font-weight:700; font-size:15px; color:var(--text-muted); line-height:1.15; }
  .pcc-hf-req{ display:block; font-size:9px; font-weight:400; color:var(--text-muted); }
  .pcc-series-del{
    width:20px; flex-shrink:0; text-align:center; color:var(--text-muted);
    background:none; border:none; font-size:16px; line-height:1; cursor:pointer; padding:2px;
  }

  .pcc-picker-row{
    display:flex; flex-wrap:wrap; gap:5px; padding:6px 10px 10px;
    background:var(--surface-2); border-bottom:1px solid var(--border);
  }
  .pcc-picker-chip{
    flex:1 1 18%; min-width:38px; text-align:center; padding:6px 2px;
    border-radius:7px; border:1px solid var(--border); background:var(--surface); cursor:pointer;
    color:var(--text);
  }
  .pcc-picker-chip .letters{ font-weight:700; font-size:14px; display:block; color:var(--text); }
  .pcc-picker-chip .pts{ font-size:9px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .pcc-picker-chip.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .pcc-picker-chip.selected .letters{ color:var(--accent); }
  .pcc-picker-chip.selected-other{ border-color:var(--border); background:var(--surface-2); }
  .pcc-picker-chip.selected-other .letters{ color:var(--text); }

  .pcc-addrow{ display:flex; justify-content:center; margin-bottom:16px; }
  .pcc-add-btn{
    background:none; border:1px dashed var(--border); color:var(--text-muted);
    border-radius:9px; padding:8px 14px; font-family:inherit; font-size:12px;
    cursor:pointer; width:100%;
  }

  .pcc-summary{ display:flex; justify-content:space-between; align-items:center; padding:10px 4px; margin-bottom:8px; }
  .pcc-summary-label{ font-size:12px; color:var(--text-muted); }
  .pcc-summary-value{ display:flex; flex-direction:column; align-items:flex-end; }
  .pcc-summary-num{ font-size:24px; font-weight:700; color:var(--text-muted); }
  .pcc-summary-sub{ font-size:11px; color:var(--text-muted); margin-top:1px; }
  .pcc-summary-num.accent{ color:var(--accent); }

  .pcc-section{ margin-top:22px; }
  .pcc-results-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .pcc-results-title{ font-size:14px; font-weight:600; }
  .pcc-results-count{ font-size:11px; color:var(--text-muted); }
  .pcc-empty{ font-size:12px; color:var(--text-muted); padding:14px 0; text-align:center; }

  .pcc-row{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:9px; padding:9px 11px; margin-bottom:6px; cursor:pointer;
  }
  .pcc-row.active{ border-color:var(--accent); }
  .pcc-dot{ width:8px; height:8px; border-radius:50%; background:var(--border); flex-shrink:0; }
  .pcc-dot.good{ background:var(--good); }
  .pcc-dot.gold{ background:var(--accent); }
  .pcc-row-main{ flex:1; min-width:0; }
  .pcc-row-name{ font-size:13px; font-weight:600; }
  .pcc-row-status{ font-size:12px; color:var(--text-muted); font-weight:700; }
  .pcc-row-status.good{ color:var(--good); }

  .pcc-export-textarea{
    width:100%; min-height:110px; background:var(--surface); border:1px solid var(--border);
    border-radius:9px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:13px;
    line-height:1.5; resize:vertical; margin-bottom:8px;
  }
  .pcc-export-actions{ display:flex; gap:8px; }
  .pcc-btn-secondary{
    flex:1; background:none; border:1px solid var(--border); color:var(--text-muted);
    border-radius:9px; padding:11px 10px; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; text-align:center;
  }
  .pcc-btn-secondary.confirm-danger{ border-color:var(--danger); color:var(--danger); font-weight:700; }
  .pcc-clearrow{ margin:14px 0; }
  .pcc-clearrow button{ width:100%; }

  .pcc-ble-section{
    margin:14px 0; padding:10px 12px; background:var(--surface); border:1px solid var(--border);
    border-radius:9px; display:flex; flex-direction:column; gap:8px;
  }
  .pcc-ble-row{ display:flex; align-items:center; gap:8px; }
  .pcc-ble-dot{ width:8px; height:8px; border-radius:50%; background:var(--text-muted); flex-shrink:0; }
  .pcc-ble-dot.on{ background:var(--good); }
  .pcc-ble-dot.pulse{ animation:pcc-pulse 1s ease-in-out infinite; }
  @keyframes pcc-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
  .pcc-ble-status{ font-size:12px; color:var(--text-muted); flex:1; line-height:1.4; }
  .pcc-ble-status.good{ color:var(--good); }
  .pcc-ble-status.err{ color:var(--danger); }
  .pcc-ble-btn{ width:100%; background:var(--accent); border:none; color:var(--accent-ink);
    border-radius:9px; padding:11px 10px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .pcc-ble-actions{ display:flex; gap:8px; }
  .pcc-ble-actions button{ flex:1; }
  .pcc-ble-last{ font-size:11px; color:var(--text-muted); }
  .pcc-ble-last.good{ color:var(--good); }
  .pcc-ble-last.live{ color:var(--accent); font-weight:600; }
  .pcc-ble-sessions{ display:flex; flex-direction:column; gap:4px; max-height:160px; overflow-y:auto; padding-right:2px; }
  .pcc-btn-primary{
    flex:1; background:var(--accent); border:none; color:var(--accent-ink);
    border-radius:9px; padding:11px 10px; font-family:inherit; font-size:13px; font-weight:700;
    cursor:pointer; text-align:center; text-decoration:none; display:block;
  }

  .pcc-footer{
    text-align:center; font-size:11px; color:var(--text-muted);
    margin-top:26px; padding-top:14px; border-top:1px solid var(--border);
  }
  .pcc-footer a{ color:var(--text-muted); text-decoration:underline; }

  #pcc-toast{
    position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px);
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:9px 16px; border-radius:999px; font-size:12px;
    opacity:0; transition:opacity .2s ease, transform .2s ease; pointer-events:none;
    max-width:90%; text-align:center; z-index:50;
  }
  #pcc-toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>

  <div class="pcc-header">
    <p class="pcc-title">Fordringar — skjutskicklighet</p>
    <p class="pcc-subtitle">Baserat på SDSSF:s fordringar och kompetensnivåer,<br>version <span style="white-space:nowrap;">2026-05-01</span></p>
  </div>
  <div id="pcc-app"></div>
</div>
<div id="pcc-toast"></div>

<script>
// Fristående lagring (ersätter Claude-förhandsvisningens window.storage när
// appen körs som en vanlig webbsida). Sparar lokalt i telefonens/webbläsarens
// egen localStorage — data delas alltså inte mellan enheter eller användare.
(function(){
  var PREFIX = 'fordringar:';
  function safe(fn, fallback){
    try { return fn(); } catch(e){ return fallback; }
  }
  window.storage = {
    get: function(key){
      return Promise.resolve(safe(function(){
        var raw = localStorage.getItem(PREFIX + key);
        if(raw === null) return null;
        return { key: key, value: raw };
      }, null));
    },
    set: function(key, value){
      return Promise.resolve(safe(function(){
        localStorage.setItem(PREFIX + key, value);
        return { key: key, value: value };
      }, null));
    },
    delete: function(key){
      return Promise.resolve(safe(function(){
        localStorage.removeItem(PREFIX + key);
        return { key: key, deleted: true };
      }, null));
    },
    list: function(prefix){
      return Promise.resolve(safe(function(){
        var keys = [];
        for(var i=0;i<localStorage.length;i++){
          var k = localStorage.key(i);
          if(k && k.indexOf(PREFIX) === 0){
            var kk = k.slice(PREFIX.length);
            if(!prefix || kk.indexOf(prefix) === 0) keys.push(kk);
          }
        }
        return { keys: keys, prefix: prefix };
      }, null));
    }
  };
})();

// Registrera service worker för offline-stöd (kräver att sidan körs via
// http/https, t.ex. GitHub Pages eller Netlify — fungerar inte lokalt via
// en dubbelklickad fil).
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
</script>

  // ---- time parsing ("500" -> 5,00 / "34" -> 3,40 / "1111" -> 11,11) ----
  function splitTimeDigits(raw){
    var n = raw.length;
    var decLen = n <= 1 ? 0 : Math.min(2, n - 1);
    var decDigits = decLen > 0 ? raw.slice(n - decLen) : '';
    var intDigits = decLen > 0 ? raw.slice(0, n - decLen) : raw;
    if(intDigits === '') intDigits = '0';
    var decPart = decDigits.padEnd(2, '0');
    return { intDigits: intDigits, decPart: decPart };
  }
  function formatTimeDisplay(raw){
    if(!raw) return '';
    var p = splitTimeDigits(raw);
    return p.intDigits + ',' + p.decPart;
  }
  function timeValue(raw){
    if(!raw) return null;
    var p = splitTimeDigits(raw);
    var v = parseFloat(p.intDigits + '.' + p.decPart);
    return isNaN(v) ? null : v;
  }

  function rawPoints(t1, t2, groups, legendMap){
    if(groups === 1){
      if(!t1) return null;
      return legendMap[t1];
    }
    if(!t1 || !t2) return null;
    return legendMap[t1] + legendMap[t2];
  }
  function computeHF(time, t1, t2, groups, legendMap){
    var t = timeValue(time);
    if(!t || t <= 0) return null;
    var pts = rawPoints(t1, t2, groups, legendMap);
    if(pts === null) return null;
    pts = Math.max(0, pts);
    return Math.round((pts / t) * 1000) / 1000;
  }
  function fmt(n){ return n === null || n === undefined ? '–' : n.toFixed(2); }
  function fmtSv(n){ return n.toFixed(2).replace('.', ','); }
  function isGood(hf, min){ return hf !== null && hf >= min; }

  // Marginal: hur många sekunder kvar till maxtiden för silver, baserat enbart på inmatad tid.
  function marginDisplay(rawTime, stageObj){
    var t = timeValue(rawTime);
    if(t === null) return '–';
    var fullPts = stageObj.groups === 1 ? 10 : 20;
    var maxTimeSilver = fullPts / stageObj.silver;
    return fmtSv(Math.round((maxTimeSilver - t) * 100) / 100) + 's';
  }
  // Behövd tid: om träffarna redan är inmatade men inte räcker till silver,
  // vilken tid hade krävts med just DE träffarna.
  function requiredTimeHtml(t1, t2, hf, stageObj, groups, legendMap){
    if(hf === null || hf >= stageObj.silver) return '';
    var pts = Math.max(0, rawPoints(t1, t2, groups, legendMap));
    if(pts <= 0) return '<span class="pcc-hf-req">(ej möjligt)</span>';
    var reqTime = Math.round((pts / stageObj.silver) * 100) / 100;
    return '<span class="pcc-hf-req">(' + fmtSv(reqTime) + 's)</span>';
  }

  function seriesPassed(s, min, groups, legendMap){
    var hf = computeHF(s.time, s.t1, s.t2, groups, legendMap);
    return hf !== null && hf >= min;
  }
  function hasThreeStreak(list, min, groups, legendMap){
    var streak = 0;
    for(var i=0;i<list.length;i++){
      if(seriesPassed(list[i], min, groups, legendMap)){ streak++; if(streak>=3) return true; }
      else streak = 0;
    }
    return false;
  }
  function trailingStreak(list, min, groups, legendMap){
    var streak = 0;
    for(var i=list.length-1;i>=0;i--){
      if(seriesPassed(list[i], min, groups, legendMap)) streak++; else break;
    }
    return streak;
  }
  var TIER_ORDER = ['elite','gold','silver'];
  var TIER_LABEL = { silver:'Silver', gold:'Guld', elite:'Elit' };
  var TIER_SUFFIX = { silver:'', gold:'guld', elite:'elit' };
  function tierFor(list, stageObj, legendMap){
    for(var i=0;i<TIER_ORDER.length;i++){
      var t = TIER_ORDER[i];
      if(hasThreeStreak(list, stageObj[t], stageObj.groups, legendMap)) return t;
    }
    return null;
  }
  function nextTierAfter(tier){
    if(!tier) return 'silver';
    if(tier === 'silver') return 'gold';
    if(tier === 'gold') return 'elite';
    return null;
  }

  // ---- BLE (Smart Shot Timer) ----
  function bleSetStatus(msg, kind){
    state.ble.status = msg || '';
    state.ble.statusKind = kind || '';
    render();
  }

  // Skriver raw (centisekunder) till en serie-rad. Om existingRowIdx pekar på en rad som redan
  // hör till den här sessionen skrivs samma rad över (t.ex. om man fortsätter efter en paus och
  // skjuter fler skott); annars används nästa tomma rad / en ny rad läggs till.
  function bleImportShotRaw(raw, existingRowIdx){
    var list = getActiveList();
    if(!list){
      showToast('Välj en skytt innan du skjuter');
      return null;
    }
    var isNew = (existingRowIdx === null || existingRowIdx === undefined || !list[existingRowIdx]);
    var idx;
    if(!isNew){
      idx = existingRowIdx;
    } else {
      idx = -1;
      for(var i=0;i<list.length;i++){ if(!list[i].time){ idx = i; break; } }
      if(idx === -1){
        idx = list.length;
        list.push({time:'', t1:null, t2:null});
      }
    }
    list[idx].time = raw;
    if(isNew) state.ble.shotCount++;
    persistShooters();
    return { display: formatTimeDisplay(raw), idx: idx };
  }

  // Returnerar den pågående (senaste, ej avslutade) radens session-objekt, skapar en ny rad
  // om ingen finns än (t.ex. om appen missade ett SESSION_STARTED).
  function bleCurrentSessionLine(){
    var lines = state.ble.sessionLines;
    if(lines.length === 0 || lines[lines.length - 1].done){
      lines.push({ display: '', raw: '', rowIdx: null, imported: false, done: false });
    }
    return lines[lines.length - 1];
  }

  function bleHandleSgEvent(evt){
    try{
      var dv = evt.target.value; // DataView
      if(!dv || dv.byteLength < 2) return;
      var eventId = dv.getUint8(1);
      switch(eventId){
        case BLE_EVENT.SESSION_STARTED:
          state.ble.sessId = dv.getUint32(2, false);
          // Ny rad för den här sessionen — tom tills första skottet
          state.ble.sessionLines.push({ display: '', raw: '', rowIdx: null, imported: false, done: false });
          bleSetStatus('Session startad — väntar på skott…', 'good');
          break;
        case BLE_EVENT.SESSION_SET_BEGIN:
          bleSetStatus('Klart — skjut!', 'good');
          break;
        case BLE_EVENT.SESSION_SUSPENDED: {
          // Timern går till "fortsätt / starta"-läge (dvs den fysiska "stopp"-knappen). Det är HÄR
          // vi ska uppdatera raden med senaste skottets tid — inte när man senare backar till
          // startsidan (det skickar inget SESSION_STOPPED-event på alla timers).
          var line = bleCurrentSessionLine();
          if(line.raw){
            var res = bleImportShotRaw(line.raw, line.rowIdx);
            if(res){
              line.display = res.display;
              line.rowIdx = res.idx;
              line.imported = true;
              bleSetStatus('Pausad — ' + res.display + 's importerad (fortsätt eller avsluta på timern)', 'good');
            } else {
              bleSetStatus('Pausad — kunde inte importera (ingen skytt vald)', 'err');
            }
          } else {
            bleSetStatus('Pausad — inga skott ännu', '');
          }
          // OBS: markeras INTE som "done" här — sessionen kan fortsätta (Continue), och
          // skjuts fler skott ska samma rad uppdateras igen vid nästa paus/stopp.
          render();
          break;
        }
        case BLE_EVENT.SESSION_RESUMED:
          bleSetStatus('Session återupptagen — väntar på fler skott…', 'good');
          break;
        case BLE_EVENT.SESSION_STOPPED: {
          // Fallback: om timern ändå skickar ett riktigt stopp (t.ex. reset till startsidan
          // eller om SUSPENDED av någon anledning missades), importera/uppdatera en sista gång
          // och lås raden så den inte uppdateras mer.
          var stopLine = bleCurrentSessionLine();
          if(stopLine.raw){
            var stopRes = bleImportShotRaw(stopLine.raw, stopLine.rowIdx);
            if(stopRes){
              stopLine.display = stopRes.display;
              stopLine.rowIdx = stopRes.idx;
              stopLine.imported = true;
            }
          }
          stopLine.done = true;
          bleSetStatus(stopLine.imported ? ('Session avslutad — ' + stopLine.display + 's') : 'Session avslutad — inga skott', stopLine.imported ? 'good' : '');
          render();
          break;
        }
        case BLE_EVENT.SHOT_DETECTED: {
          var shotNum = dv.getUint16(6, false);
          var shotTimeMs = dv.getUint32(8, false);
          var raw = String(Math.max(1, Math.round(shotTimeMs / 10))); // centisekunder, samma format som manuell inmatning
          // Spara bara senaste skottet på den pågående sessionens rad — raden i tabellen
          // skrivs/uppdateras först när timern pausas eller stoppas.
          var curLine = bleCurrentSessionLine();
          curLine.raw = raw;
          curLine.display = formatTimeDisplay(raw);
          curLine.imported = false; // väntar på att synkas till tabellen vid paus/stopp
          bleSetStatus('Skott ' + (shotNum + 1) + ' registrerat (uppdateras vid paus/stopp)', '');
          break;
        }
        default:
          // Okänd/oväntad händelse — visa den så det går att felsöka om timern beter sig annorlunda
          bleSetStatus('Okänd händelse mottagen (id ' + eventId + ')', '');
      }
    }catch(err){
      console.error('BLE event error', err);
      bleSetStatus('Fel vid tolkning av timerdata: ' + (err && err.message ? err.message : err), 'err');
    }
  }

  // ---- SpecialPie M1A2 ----
  function bleHandlePieEvent(evt){
    try{
      var dv = evt.target.value;
      if(!dv || dv.byteLength < 6) return;
      var bytes = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
      if(bytes[0] !== 0xF8 || bytes[1] !== 0xF9) return; // okänt ramformat, ignorera
      var payload = bytes.slice(2, bytes.length - 2);
      if(payload.length === 2){
        var type = payload[0];
        if(type === PIE_CTRL.START){
          state.ble.sessionLines.push({ display: '', raw: '', rowIdx: null, imported: false, done: false });
          bleSetStatus('Session startad — väntar på skott…', 'good');
        } else if(type === PIE_CTRL.STOP){
          var stopLine = bleCurrentSessionLine();
          if(stopLine.raw){
            var stopRes = bleImportShotRaw(stopLine.raw, stopLine.rowIdx);
            if(stopRes){
              stopLine.display = stopRes.display;
              stopLine.rowIdx = stopRes.idx;
              stopLine.imported = true;
            }
          }
          stopLine.done = true;
          bleSetStatus(stopLine.imported ? ('Session avslutad — ' + stopLine.display + 's') : 'Session avslutad — inga skott', stopLine.imported ? 'good' : '');
          render();
        } else {
          bleSetStatus('Okänd PIE-kontrollhändelse (typ 0x' + type.toString(16) + ')', '');
        }
      } else if(payload.length === 6 && payload[0] === PIE_SHOT_TAG){
        var seconds = payload[2];
        var hundredths = payload[3];
        var shotNum = payload[4];
        var raw = String(seconds * 100 + hundredths);
        var curLine = bleCurrentSessionLine();
        curLine.raw = raw;
        curLine.display = formatTimeDisplay(raw);
        curLine.imported = false;
        bleSetStatus('Skott ' + shotNum + ' registrerat (uppdateras vid stopp)', '');
      } else {
        bleSetStatus('Okänt PIE-meddelande mottaget', '');
      }
    }catch(err){
      console.error('PIE BLE event error', err);
      bleSetStatus('Fel vid tolkning av timerdata: ' + (err && err.message ? err.message : err), 'err');
    }
  }


  function bleHandleDisconnect(){
    state.ble.connected = false;
    state.ble.connecting = false;
    state.ble.protocol = null;
    state.ble.device = null;
    state.ble.server = null;
    state.ble.eventChar = null;
    state.ble.commandChar = null;
    state.ble.pendingShotMs = null;
    state.ble.pendingShotNum = null;
    // Om en session var igång när uppkopplingen bröts, markera dess rad som avslutad
    // (utan att importera — det görs bara vid ett riktigt STOP-kommando från timern)
    var lines = state.ble.sessionLines;
    if(lines.length && !lines[lines.length - 1].done){
      lines[lines.length - 1].done = true;
    }
    bleSetStatus('Frånkopplad', '');
  }

  window.pccBleConnect = async function(){
    if(!navigator.bluetooth){
      bleSetStatus('Web Bluetooth stöds inte i den här webbläsaren (använd Chrome på Android).', 'err');
      return;
    }
    if(!getActiveList()){
      showToast('Välj en skytt först');
      return;
    }
    state.ble.connecting = true;
    bleSetStatus('Söker efter tidtagare…', '');
    try{
      var device = await navigator.bluetooth.requestDevice({
        filters: [{ services: [BLE_SERVICE_UUID] }, { services: [PIE_SERVICE_UUID] }],
        optionalServices: [BLE_SERVICE_UUID, PIE_SERVICE_UUID]
      });
      state.ble.device = device;
      state.ble.name = device.name || 'Tidtagare';
      device.addEventListener('gattserverdisconnected', bleHandleDisconnect);

      bleSetStatus('Ansluter till ' + state.ble.name + '…', '');
      var server = await device.gatt.connect();
      state.ble.server = server;

      var service = null;
      try{ service = await server.getPrimaryService(BLE_SERVICE_UUID); state.ble.protocol = 'sg'; }catch(e){ /* inte en SG-timer */ }
      if(!service){
        try{ service = await server.getPrimaryService(PIE_SERVICE_UUID); state.ble.protocol = 'pie'; }catch(e){ /* inte heller PIE */ }
      }
      if(!service){
        throw new Error('Ingen känd tidtagartjänst hittades på enheten');
      }

      if(state.ble.protocol === 'sg'){
        var eventChar = await service.getCharacteristic(BLE_CHAR_EVENT);
        await eventChar.startNotifications();
        eventChar.addEventListener('characteristicvaluechanged', bleHandleSgEvent);
        state.ble.eventChar = eventChar;

        try{
          state.ble.commandChar = await service.getCharacteristic(BLE_CHAR_COMMAND);
        }catch(e){ /* valfritt */ }

        // Synka klockan på tidtagaren med telefonens tid
        try{
          var unixChar = await service.getCharacteristic(BLE_CHAR_UNIX_TIME);
          var buf = new ArrayBuffer(4);
          new DataView(buf).setUint32(0, Math.floor(Date.now() / 1000), false);
          await unixChar.writeValue(buf);
        }catch(e){ /* valfritt, fortsätt ändå */ }
      } else {
        var notifyChar = await service.getCharacteristic(PIE_CHAR_NOTIFY);
        await notifyChar.startNotifications();
        notifyChar.addEventListener('characteristicvaluechanged', bleHandlePieEvent);
        state.ble.eventChar = notifyChar;
      }

      state.ble.connecting = false;
      state.ble.connected = true;
      state.ble.shotCount = 0;
      state.ble.sessionLines = [];
      state.ble.pendingShotMs = null;
      state.ble.pendingShotNum = null;
      bleSetStatus('Ansluten till ' + state.ble.name + ' (' + state.ble.protocol.toUpperCase() + ') — redo att ta emot skott', 'good');
    }catch(err){
      state.ble.connecting = false;
      state.ble.connected = false;
      if(err && err.name === 'NotFoundError'){
        bleSetStatus('Ingen enhet vald', '');
      } else {
        bleSetStatus('Anslutning misslyckades: ' + (err && err.message ? err.message : err), 'err');
      }
    }
  };

  // ---- targeted DOM update (keeps focus while typing time) ----
  function updateSeriesDisplay(idx){

    var s = list[idx];

      row.classList.toggle('pcc-row-gold', isGood(hf, stageObj.gold));

  // ---- render helpers ----
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function chipLabel(code){ return code ? code : '···'; }

  function shooterChipsHtml(){
    var chips = state.shooters.map(function(sh){
      var active = sh.id === state.activeShooterId ? ' active' : '';
      var pending = state.pendingDeleteShooter === sh.id;
      return '' +
        '<div class="pcc-shooter-chip' + active + '" onclick="pccSelectShooter(\'' + sh.id + '\')">' +
          '<span>' + escapeHtml(sh.name) + '</span>' +
          '<button type="button" class="del' + (pending?' confirm':'') + '" onclick="pccDeleteShooter(\'' + sh.id + '\', event)">' +
            (pending ? 'säker?' : '×') +
          '</button>' +
        '</div>';
    }).join('');
    return '' +
      '<div class="pcc-shooters">' +
        '<div class="pcc-shooter-chips">' + chips + '</div>' +
        '<div class="pcc-add-shooter">' +
          '<input id="pcc-new-shooter-input" type="text" placeholder="Namn på ny skytt" onkeydown="pccNewShooterKey(event)">' +
          '<button type="button" onclick="pccAddShooter()">Lägg till</button>' +
        '</div>' +
      '</div>';
  }

  function statusBannerHtml(sh, stageObj, legendMap){
    if(!sh) return '';
    var list = sh.disciplines[state.discipline][state.stage];
    var tier = tierFor(list, stageObj, legendMap);
    if(tier === 'elite'){
      return '<div class="pcc-status pcc-status-pass">Elit — högsta nivån klarad</div>';
    }
    var next = nextTierAfter(tier);
    var streak = trailingStreak(list, stageObj[next], stageObj.groups, legendMap);
    if(!tier && streak === 0){
      return '<div class="pcc-status">Inga godkända i rad ännu</div>';
    }
    var prefix = tier ? TIER_LABEL[tier] + ' klarat. ' : '';
    var cls = tier ? ' pcc-status-pass' : '';
    return '<div class="pcc-status' + cls + '">' + prefix + streak + ' av 3 i rad mot ' + TIER_LABEL[next].toLowerCase() + ' — behöver ' + (3-streak) + ' till</div>';
  }

  function seriesRowHtml(list, idx, stageObj, legendMap, legendList){
    var s = list[idx];
    var groups = stageObj.groups;
    var hf = computeHF(s.time, s.t1, s.t2, groups, legendMap);
    var t1Active = state.activePicker && state.activePicker.idx === idx && state.activePicker.target === 't1';
    var t2Active = state.activePicker && state.activePicker.idx === idx && state.activePicker.target === 't2';
    var t1Cls = s.t1 ? (s.t1 === 'AA' ? ' filled-aa' : ' filled-other') : '';
    var t2Cls = s.t2 ? (s.t2 === 'AA' ? ' filled-aa' : ' filled-other') : '';

    var chipsHtml = '<button type="button" class="pcc-chip' + t1Cls + (t1Active?' active':'') + '" onclick="pccOpenPicker(' + idx + ',\'t1\')">' + chipLabel(s.t1) + '</button>';
    if(groups === 2){
      chipsHtml += '<button type="button" class="pcc-chip' + t2Cls + (t2Active?' active':'') + '" onclick="pccOpenPicker(' + idx + ',\'t2\')">' + chipLabel(s.t2) + '</button>';
    }

    var reqHtml = requiredTimeHtml(s.t1, s.t2, hf, stageObj, groups, legendMap);

    var row = '' +
      '<div class="pcc-series-row' + (isGood(hf, stageObj.gold)?' pcc-row-gold':'') + '" id="pcc-row-' + idx + '">' +
        '<div class="pcc-series-idx">' + (idx+1) + '</div>' +
        '<input class="pcc-time-field mono" type="text" inputmode="decimal" placeholder="0,00" value="' + escapeHtml(formatTimeDisplay(s.time)) + '" onkeydown="pccTimeKey(event, ' + idx + ')">' +
        '<div class="pcc-hitgroup">' + chipsHtml + '</div>' +
        '<div id="pcc-marg-' + idx + '" class="pcc-series-marg mono">' + marginDisplay(s.time, stageObj) + '</div>' +
        '<div id="pcc-hf-' + idx + '" class="pcc-series-hf mono' + (isGood(hf,stageObj.silver)?' good':'') + '">' + fmt(hf) + reqHtml + '</div>' +
        (list.length > 1
          ? '<button type="button" class="pcc-series-del" onclick="pccRemoveSeries(' + idx + ')">&times;</button>'
          : '<div style="width:20px;flex-shrink:0;"></div>') +
      '</div>';

    if(t1Active || t2Active){
      var target = t1Active ? 't1' : 't2';
      row += '<div class="pcc-picker-row">' + legendList.map(function(l){
        var isSel = s[target] === l.code;
        var sel = isSel ? (l.code === 'AA' ? ' selected' : ' selected selected-other') : '';
        return '<button type="button" class="pcc-picker-chip' + sel + '" onclick="pccChooseCode(' + idx + ',\'' + target + '\',\'' + l.code + '\')">' +
               '<span class="letters">' + l.code + '</span><span class="pts">' + l.pts + 'p</span>' +
               '</button>';
      }).join('') + '</div>';
    }
    return row;
  }

  function seriesListHtml(list, stageObj, legendMap, legendList){
    var rows = list.map(function(_, idx){ return seriesRowHtml(list, idx, stageObj, legendMap, legendList); }).join('');
    var headCols = '<div style="width:14px;"></div><div style="width:64px;">Tid</div>';
    if(stageObj.groups === 2){
      headCols += '<div class="pcc-hitgroup"><div style="width:44px;text-align:center;">T1</div><div style="width:44px;text-align:center;">T2</div></div>';
    } else {
      headCols += '<div class="pcc-hitgroup"><div style="width:44px;text-align:center;">Träff</div></div>';
    }
    headCols += '<div style="width:46px;text-align:center;">Marg.</div><div style="width:62px;text-align:right;">HF</div><div style="width:20px;"></div>';
    var addBtnInner = '<button type="button" class="pcc-add-btn" onclick="pccAddSeries()">+ Lägg till serie (' + list.length + ')</button>';
    return '' +
      '<div class="pcc-serieslist">' +
        '<div class="pcc-list-header">' + headCols + '</div>' +
        '<div id="pcc-serieslist-rows">' + rows + '</div>' +
      '</div>' +
      '<div class="pcc-addrow" id="pcc-addrow-wrap">' + addBtnInner + '</div>';
  }

  function bleSessionLinesHtml(){
    var lines = state.ble.sessionLines;
    if(!lines.length){
      return '<div class="pcc-ble-last">Ingen session ännu — tryck start på timern.</div>';
    }
    var rows = lines.map(function(line, idx){
      var value = line.display ? escapeHtml(line.display) + 's' : '–';
      var cls = 'pcc-ble-last' + (line.imported ? ' good' : (!line.done ? ' live' : ''));
      var note;
      if(!line.done){
        note = line.imported ? ' (pausad — fortsätt eller avsluta)' : ' (pågår…)';
      } else {
        note = line.imported ? '' : ' (inga skott)';
      }
      return '<div class="' + cls + '">Skjutning ' + (idx + 1) + ': <span class="mono">' + value + '</span>' + note + '</div>';
    }).join('');
    return '<div class="pcc-ble-sessions">' + rows + '</div>';
  }

  function bleSectionHtml(){
    var ble = state.ble;
    if(!ble.supported){
      return '<div class="pcc-ble-section"><div class="pcc-ble-status err">Bluetooth-anslutning till tidtagare stöds inte i den här webbläsaren (använd Chrome på Android).</div></div>';
    }
    var statusCls = 'pcc-ble-status' + (ble.statusKind ? ' ' + ble.statusKind : '');
    var dotCls = 'pcc-ble-dot' + (ble.connected ? ' on' : '') + (ble.connecting ? ' pulse' : '');

    if(!ble.connected){
      return '' +
        '<div class="pcc-ble-section">' +
          '<button type="button" class="pcc-ble-btn" onclick="pccBleConnect()" ' + (ble.connecting?'disabled':'') + '>' +
            (ble.connecting ? 'Ansluter…' : '⏱ Anslut till Timer (SG / PIE)') +
          '</button>' +
          (ble.status ? '<div class="pcc-ble-row"><div class="' + dotCls + '"></div><div class="' + statusCls + '">' + escapeHtml(ble.status) + '</div></div>' : '') +
        '</div>';
    }

    return '' +
      '<div class="pcc-ble-section">' +
        '<div class="pcc-ble-row">' +
          '<div class="' + dotCls + '"></div>' +
          '<div class="' + statusCls + '">' + escapeHtml(ble.status || ('Ansluten till ' + ble.name + (ble.protocol ? ' (' + ble.protocol.toUpperCase() + ')' : ''))) + '</div>' +
        '</div>' +
        bleSessionLinesHtml() +
        (ble.commandChar ? (
          '<div class="pcc-ble-actions">' +
            '<button type="button" class="pcc-btn-secondary" onclick="pccBleSendCommand(' + BLE_CMD.SESSION_START + ')">Starta</button>' +
            '<button type="button" class="pcc-btn-secondary" onclick="pccBleSendCommand(' + BLE_CMD.SESSION_STOP + ')">Stoppa</button>' +
          '</div>'
        ) : '') +
        '<div class="pcc-ble-actions">' +
          '<button type="button" class="pcc-btn-secondary" onclick="pccBleDisconnect()">Koppla från (' + ble.shotCount + ' skott importerade)</button>' +
        '</div>' +
      '</div>';
  }

  function shooterStatusListHtml(stageObj){
    if(!state.shooters.length) return '<div class="pcc-empty">Inga skyttar tillagda än.</div>';
    var legendMap = DISCIPLINES[state.discipline].legendMap;
    var rows = state.shooters.map(function(sh){
      var list = sh.disciplines[state.discipline][state.stage];
      var tier = tierFor(list, stageObj, legendMap);
      var streak = trailingStreak(list, stageObj[nextTierAfter(tier)] || stageObj.silver, stageObj.groups, legendMap);
      var hasAttempts = list.some(function(s){ return s.time || s.t1 || s.t2; });
      var statusText = tier ? TIER_LABEL[tier] : (streak > 0 ? streak + '/3 i rad' : (hasAttempts ? 'Underkänd hittills' : 'Ej påbörjad'));
      var activeCls = sh.id === state.activeShooterId ? ' active' : '';
      var dotCls = tier === 'silver' ? ' good' : ((tier==='gold'||tier==='elite') ? ' gold' : '');
      return '' +
        '<div class="pcc-row' + activeCls + '" onclick="pccSelectShooter(\'' + sh.id + '\')">' +
          '<div class="pcc-dot' + dotCls + '"></div>' +
          '<div class="pcc-row-main"><div class="pcc-row-name">' + escapeHtml(sh.name) + '</div></div>' +
          '<div class="pcc-row-status' + (tier?' good':'') + '">' + statusText + '</div>' +
        '</div>';
    }).join('');
    return rows;
  }

  function buildExportText(){
    var lines = [];
    state.shooters.forEach(function(sh){
      var clauses = [];
      var allFullPlainSilver = true;
      var anyPassed = false;
      DISCIPLINE_ORDER.forEach(function(dk){
        var disc = DISCIPLINES[dk];
        var passedEntries = [];
        disc.stageOrder.forEach(function(sk){
          var st = disc.stages[sk];
          var tier = tierFor(sh.disciplines[dk][sk], st, disc.legendMap);
          if(tier) passedEntries.push({ dist: sk, tier: tier });
        });
        if(passedEntries.length === 0){ allFullPlainSilver = false; return; }
        anyPassed = true;
        var allDistances = passedEntries.length === disc.stageOrder.length;
        var allPlainSilver = passedEntries.every(function(e){ return e.tier === 'silver'; });
        if(allDistances && allPlainSilver){
          clauses.push(disc.title + ' (samtliga)');
        } else {
          allFullPlainSilver = false;
          var parts = passedEntries.map(function(e){
            return e.dist + (TIER_SUFFIX[e.tier] ? ' ' + TIER_SUFFIX[e.tier] : '');
          });
          clauses.push(disc.title + ' (' + parts.join(', ') + ')');
        }
      });
      if(!anyPassed) return;
      if(allFullPlainSilver){
        lines.push(sh.name + ' klarat samtliga grenar.');
      } else {
        lines.push(sh.name + ' godkänd: ' + clauses.join(', ') + '.');
      }
    });
    return lines.join('\n');
  }

  function buildMailto(text){
    var subject = 'Fordringar skjutskicklighet — resultat ' + new Date().toISOString().slice(0,10);
    return 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(text);
  }

  function exportSectionHtml(){
    var head = '' +
      '<div class="pcc-results-head">' +
        '<span class="pcc-results-title">Exportera dagens resultat</span>' +
        '<button type="button" class="pcc-desc-toggle" onclick="pccToggleExport()">' + (state.exportOpen ? 'Dölj' : 'Visa') + '</button>' +
      '</div>';
    if(!state.exportOpen) return head;
    var text = buildExportText();
    if(!text) return head + '<div class="pcc-empty">Ingen skytt har klarat 3 i rad än.</div>';
    var mailto = buildMailto(text);
    return head +
      '<textarea id="pcc-export-text" class="pcc-export-textarea" readonly onclick="this.select()">' + escapeHtml(text) + '</textarea>' +
      '<div class="pcc-export-actions">' +
        '<button type="button" class="pcc-btn-secondary" onclick="pccCopyExport()">Kopiera text</button>' +
        '<a class="pcc-btn-primary" href="' + mailto + '">Öppna i mejl</a>' +
      '</div>';
  }

  function render(){
    var disc = DISCIPLINES[state.discipline];
    var stageObj = disc.stages[state.stage];
    var legendMap = disc.legendMap;
    var legendList = disc.legendList;
    var fullPts = stageObj.groups === 1 ? 10 : 20;
    var maxTime = Math.round((fullPts / stageObj.silver) * 100) / 100;
    var sh = getActiveShooter();

    var descLines = state.descExpanded ? stageObj.lines : [stageObj.lines[0]];
    var descHtml = descLines.map(function(l){ return '<p>' + escapeHtml(l) + '</p>'; }).join('');
    if(state.descExpanded && disc.diagram){
      descHtml += '<img src="' + disc.diagram + '" alt="' + escapeHtml(disc.diagramAlt||'') + '" style="width:100%;border-radius:8px;margin-top:8px;display:block;">';
    }

    var html = '' +
      shooterChipsHtml() +

      '<div class="pcc-tabs pcc-tabs-discipline">' +
        DISCIPLINE_ORDER.map(function(k){
          return '<button type="button" class="pcc-tab' + (k===state.discipline?' active':'') + '" onclick="pccSelectDiscipline(\'' + k + '\')">' + DISCIPLINES[k].title + '</button>';
        }).join('') +
      '</div>' +

      '<div class="pcc-tabs">' +
        disc.stageOrder.map(function(k){
          return '<button type="button" class="pcc-tab' + (k===state.stage?' active':'') + '" onclick="pccSelectStage(\'' + k + '\')">' + disc.stages[k].label + '</button>';
        }).join('') +
      '</div>' +

      '<div class="pcc-desc">' + descHtml +
        '<button type="button" class="pcc-desc-toggle" onclick="pccToggleDesc()">' +
          (state.descExpanded ? 'Visa mindre' : 'Visa hela momentet') +
        '</button>' +
      '</div>';

    if(!sh){
      html += '<div class="pcc-empty-shooters">Lägg till en skytt ovan för att börja registrera serier.</div>';
    } else {
      var list = sh.disciplines[state.discipline][state.stage];
      html +=
        statusBannerHtml(sh, stageObj, legendMap) +
        seriesListHtml(list, stageObj, legendMap, legendList) +
        '<div class="pcc-summary">' +
          '<span class="pcc-summary-label">Maxtid för silver (full träff, ' + (stageObj.groups===1?'AA':'AA+AA') + ')</span>' +
          '<span class="pcc-summary-value">' +
            '<span class="pcc-summary-num mono accent">' + maxTime.toFixed(2).replace('.', ',') + 's</span>' +
            '<span class="pcc-summary-sub mono">HF ' + fmtSv(stageObj.silver) + '</span>' +
          '</span>' +
        '</div>' +
        '<div class="pcc-clearrow">' +
          '<button type="button" class="pcc-btn-secondary' + (state.pendingClearSeries?' confirm-danger':'') + '" onclick="pccClearAllSeries()">' +
            (state.pendingClearSeries ? 'Säker? Tryck igen för att radera allt' : 'Rensa alla serier (' + escapeHtml(sh.name) + ', ' + disc.title + ' ' + stageObj.label + ')') +
          '</button>' +
        '</div>' +
        bleSectionHtml();
    }

    html +=
      '<div class="pcc-section">' +
        '<div class="pcc-results-head">' +
          '<span class="pcc-results-title">Status – ' + disc.title + ' ' + stageObj.label + '</span>' +
          '<span class="pcc-results-count">' + state.shooters.length + ' skyttar</span>' +
        '</div>' +
        shooterStatusListHtml(stageObj) +
      '</div>' +

      '<div class="pcc-section">' +
        exportSectionHtml() +
      '</div>' +

      '<div class="pcc-footer">Version ' + APP_VERSION + '</div>';

    document.getElementById('pcc-app').innerHTML = html;
  }

  render();
  loadShooters();
})();
</script>
</body>
</html>
